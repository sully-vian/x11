name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ctypes compiles its stubs against Xlib's headers
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - id: dune
        run: |
          curl -fsSL https://get.dune.build/install | sh -s - --release latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "version=$("$HOME/.local/bin/dune" --version)" >> "$GITHUB_OUTPUT"
      # The packages built from dune.lock (compiler, ctypes, odoc...) live in
      # _build/_private. A new dune version rebuilds them, hence the key.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            _build
          key: dune-${{ runner.os }}-${{ steps.dune.outputs.version }}-${{ hashFiles('dune.lock/**') }}
      - run: dune tools install odoc
      - run: dune build --display short @doc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/default/_doc/_html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
