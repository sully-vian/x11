name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ctypes compiles its stubs against Xlib's headers
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev
      # keep compiler and packages from dune.lock between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ hashFiles('dune.lock/**') }}
      - run: |
          curl -fsSL https://get.dune.build/install | sh -s - --release latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: dune tools install odoc
      - run: dune build --display short @doc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/default/_doc/_html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
